{% extends "base.html" %}

{% block title %}Administrator Sign In — Fact Box Consult{% endblock %}

{% block content %}
<section style="padding: 96px 0;">
  <div class="container" style="max-width: 480px;">
    <div style="background: white; padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-subtle);">
      <h1 style="font-size: 24px; margin-bottom: 8px; text-align: center;">Administrator Sign In</h1>
      <p style="color: var(--color-text-muted); font-size: 14px; text-align: center; margin-bottom: 32px;">
        Authorized access for content management.
      </p>

      <form method="POST" action="{{ url_for('admin.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div style="margin-bottom: 20px;">
          <label for="email" style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px;">Email</label>
          <input type="email" id="email" name="email" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: 15px;">
        </div>

        <div style="margin-bottom: 24px;">
          <label for="password" style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px;">Password</label>
          <input type="password" id="password" name="password" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: inherit; font-size: 15px;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Sign In</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
