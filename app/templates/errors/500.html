{% extends "base.html" %}

{% block title %}500 — Server Error | Fact Box Consult{% endblock %}

{% block content %}
<section style="padding: 120px 0; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <h1 style="font-size: 64px; color: var(--color-primary); margin-bottom: 16px;">500</h1>
    <h2 style="font-size: 28px; margin-bottom: 16px;">Internal Server Error</h2>
    <p style="color: var(--color-text-muted); font-size: 16px; margin-bottom: 32px;">
      An unexpected error occurred while processing your request. Our engineering team has been notified.
    </p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Return Home</a>
  </div>
</section>
{% endblock %}
