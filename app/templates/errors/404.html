{% extends "base.html" %}

{% block title %}404 — Page Not Found | Fact Box Consult{% endblock %}

{% block content %}
<section style="padding: 120px 0; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <h1 style="font-size: 64px; color: var(--color-primary); margin-bottom: 16px;">404</h1>
    <h2 style="font-size: 28px; margin-bottom: 16px;">Page Not Found</h2>
    <p style="color: var(--color-text-muted); font-size: 16px; margin-bottom: 32px;">
      The page you are looking for does not exist or may have been relocated.
    </p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Return Home</a>
  </div>
</section>
{% endblock %}
