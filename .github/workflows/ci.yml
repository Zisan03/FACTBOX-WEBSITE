name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factbox_user
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: factbox_consult_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest against isolated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://factbox_user:test_password_123@localhost:5432/factbox_consult_test
          DATABASE_URL: postgresql://factbox_user:test_password_123@localhost:5432/factbox_consult_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          FLASK_CONFIG: testing
        run: |
          pytest -v
